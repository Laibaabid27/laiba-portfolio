<style>
/* THEME VARIABLES */
:root {
  --bg: #f6f6f6;
  --text: #111;
  --card-bg: #fff;
  --pill-bg: #111;
  --pill-text: #fff;
  --header-bg: #111;
  --header-text: #fff;
}

/* DARK MODE VARIABLES */
body.dark {
  --bg: #050509;
  --text: #f5f5f5;
  --card-bg: #111318;
  --pill-bg: #f5f5f5;
  --pill-text: #111318;
  --header-bg: #050509;
  --header-text: #f5f5f5;
}

/* GLOBAL STYLING */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

header {
  padding: 2rem 1rem;
  background: var(--header-bg);
  color: var(--header-text);
  text-align: center;
  position: relative;
}

nav {
  background: var(--header-bg);
  text-align: center;
  padding: 0.8rem 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav a {
  color: var(--header-text);
  text-decoration: none;
  margin: 0 1rem;
  font-size: 0.95rem;
}

nav a:hover {
  text-decoration: underline;
}

#themeToggle {
  position: absolute;
  right: 1.5rem;
  top: 1.5rem;
  padding: .4rem .8rem;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font-size: .8rem;
}

section {
  padding: 2rem;
  max-width: 900px;
  margin: auto;
}

.card {
  background: var(--card-bg);
  padding: 1.2rem;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  margin-bottom: 1.5rem;
}

h2 {
  margin-bottom: 1rem;
}

.pill {
  background: var(--pill-bg);
  color: var(--pill-text);
  padding: .4rem .8rem;
  border-radius: 20px;
  font-size: .8rem;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
}
